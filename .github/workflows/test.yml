name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (astro ${{ matrix.astro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astro: ['5', '6', '7']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save astro@^${{ matrix.astro }}
      - run: npm run build
      - run: npm test
